plugins { id 'com.android.application' }
android {
 namespace 'it.pydaily.app'
 compileSdk 35
 ndkVersion '28.1.13356709'
 defaultConfig {
  applicationId 'it.pydaily.app'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static','-DGGML_CCACHE=OFF'; cppFlags '-march=armv8-a' } }
 }
 externalNativeBuild { cmake { path '../native/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging false } }
 signingConfigs { projectDevelopment { storeFile file('../tools/development.jks'); storePassword 'android'; keyAlias 'pydaily'; keyPassword 'android' } }
 buildTypes { debug { signingConfig signingConfigs.projectDevelopment }; release { minifyEnabled false } }
}
