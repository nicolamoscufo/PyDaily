plugins { id 'com.android.application' }
def projectDevelopmentKey = file('../tools/development.jks')
android {
 namespace 'it.pydaily.app'
 compileSdk 35
 ndkVersion '28.1.13356709'
 defaultConfig {
  applicationId 'it.pydaily.app'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '1.0.0'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static','-DGGML_CCACHE=OFF'; cppFlags '-march=armv8-a' } }
 }
 externalNativeBuild { cmake { path '../native/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 packaging { jniLibs { useLegacyPackaging false } }
 if (projectDevelopmentKey.exists()) {
  signingConfigs { projectDevelopment { storeFile projectDevelopmentKey; storePassword 'android'; keyAlias 'pydaily'; keyPassword 'android' } }
 }
 buildTypes {
  debug { if (projectDevelopmentKey.exists()) { signingConfig signingConfigs.projectDevelopment } }
  release { minifyEnabled false }
 }
}
